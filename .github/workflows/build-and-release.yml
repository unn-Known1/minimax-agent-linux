name: Build and Release RPM

on:
  release:
    types: [published]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-rpm:
    name: Build .rpm package
    runs-on: ubuntu-latest

    container:
      image: rockylinux:9

    steps:
      - name: Install RPM build dependencies
        run: |
          set -euo pipefail
          dnf install -y \
            git \
            rpm-build \
            rpmdevtools \
            desktop-file-utils \
            tar \
            gzip \
            curl \
            binutils \
            cpio \
            findutils \
            grep \
            xz \
            zstd
          dnf clean all

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Derive package version from release tag
        run: |
          set -euo pipefail

          tag_name="${{ github.event.release.tag_name }}"
          version="${tag_name#v}"

          if [ -z "$version" ] || [ "$version" = "$tag_name" ]; then
            echo "::error::Release tag must use v<version> format, for example v3.0.14."
            exit 1
          fi

          deb_url="${{ github.server_url }}/${{ github.repository }}/releases/download/${tag_name}/minimax-agent_${version}_amd64.deb"

          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "DEB_URL=$deb_url" >> "$GITHUB_ENV"
          echo "RPM_VERSION=$version" >> "$GITHUB_ENV"

          echo "Release tag: $tag_name"
          echo "Package version: $version"
          echo "Source .deb: $deb_url"

      - name: Check RPM build scripts syntax
        run: |
          set -euo pipefail
          bash -n build-rpm.sh
          bash -n tests/verify-rpm.sh

      - name: Build RPM package
        run: |
          set -euo pipefail
          bash ./build-rpm.sh

      - name: Verify RPM package
        run: |
          set -euo pipefail

          rpm_file="$(find output -maxdepth 1 -type f -name "minimax-agent-${RPM_VERSION}-*.x86_64.rpm" | sort | tail -n 1)"

          if [ -z "$rpm_file" ]; then
            echo "::error::No .rpm package was created for version ${RPM_VERSION}."
            exit 1
          fi

          bash tests/verify-rpm.sh "$rpm_file"

      - name: Upload RPM package artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: output/*.rpm
          if-no-files-found: error

  publish-release:
    name: Upload RPM to GitHub release
    runs-on: ubuntu-latest
    needs: build-rpm

    permissions:
      contents: write

    steps:
      - name: Download RPM artifact
        uses: actions/download-artifact@v4
        with:
          name: rpm-package
          path: dist

      - name: Verify RPM asset before upload
        run: |
          set -euo pipefail

          echo "RPM release asset prepared for upload:"
          ls -lh dist

          rpm_file="$(find dist -maxdepth 1 -type f -name '*.rpm' | sort | tail -n 1)"

          if [ -z "$rpm_file" ]; then
            echo "::error::Missing RPM package artifact."
            exit 1
          fi

      - name: Upload RPM to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          fail_on_unmatched_files: true
          files: dist/*.rpm
