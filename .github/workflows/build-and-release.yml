name: Build and Release Packages

# Build Linux packages whenever a GitHub release is created.
# Note: if a release is created by another workflow using GITHUB_TOKEN,
# GitHub will not trigger this workflow from that event.
on:
  release:
    types: [created]

# Keep the default token scope minimal. The upload job grants write access only
# where release asset upload is required.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-deb:
    name: Build .deb package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Debian build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev fakeroot

      - name: Stage application payload if needed
        run: |
          set -euo pipefail

          if [ -d "linux-build/opt/minimax-agent" ]; then
            echo "Application payload already staged."
            exit 0
          fi

          deb_source="$(find releases -maxdepth 1 -type f -name 'minimax-agent_*_amd64.deb' | sort | tail -n 1)"

          if [ -z "$deb_source" ]; then
            echo "::error::linux-build/opt/minimax-agent is missing and no source .deb was found in releases/."
            exit 1
          fi

          echo "Staging application payload from $deb_source"
          tmp_root="$(mktemp -d)"
          trap 'rm -rf "$tmp_root"' EXIT

          dpkg-deb -x "$deb_source" "$tmp_root"

          if [ ! -d "$tmp_root/opt/minimax-agent" ]; then
            echo "::error::Source .deb does not contain /opt/minimax-agent."
            exit 1
          fi

          mkdir -p linux-build/opt
          cp -a "$tmp_root/opt/minimax-agent" linux-build/opt/

      - name: Check Debian build script syntax
        run: |
          set -euo pipefail
          bash -n build.sh

      - name: Build Debian package
        run: |
          set -euo pipefail
          fakeroot bash ./build.sh

      - name: Verify Debian package
        run: |
          set -euo pipefail

          deb_file="$(find output -maxdepth 1 -type f -name '*.deb' | sort | tail -n 1)"

          if [ -z "$deb_file" ]; then
            echo "::error::No .deb package was created."
            exit 1
          fi

          dpkg-deb --info "$deb_file"
          dpkg-deb --contents "$deb_file" | grep -q '/usr/bin/minimax-agent'
          dpkg-deb --contents "$deb_file" | grep -q '/usr/share/applications/minimax-agent.desktop'
          dpkg-deb --contents "$deb_file" | grep -q '/opt/minimax-agent/'

          echo "Debian package verified: $deb_file"

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: output/*.deb
          if-no-files-found: error

  build-rpm:
    name: Build .rpm package
    runs-on: ubuntu-latest

    # Use a RHEL-compatible userspace for native RPM packaging.
    container:
      image: rockylinux:9

    steps:
      - name: Install RPM build dependencies
        run: |
          set -euo pipefail
          dnf install -y \
            git \
            rpm-build \
            rpmdevtools \
            desktop-file-utils \
            tar \
            gzip \
            curl \
            binutils \
            cpio \
            findutils \
            grep \
            xz \
            zstd
          dnf clean all

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Stage application payload if needed
        run: |
          set -euo pipefail

          if [ -d "linux-build/opt/minimax-agent" ]; then
            echo "Application payload already staged."
            exit 0
          fi

          deb_source="$(find releases -maxdepth 1 -type f -name 'minimax-agent_*_amd64.deb' | sort | tail -n 1)"

          if [ -z "$deb_source" ]; then
            echo "::error::linux-build/opt/minimax-agent is missing and no source .deb was found in releases/."
            exit 1
          fi

          echo "Staging application payload from $deb_source"
          tmp_dir="$(mktemp -d)"
          tmp_root="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir" "$tmp_root"' EXIT

          cp "$deb_source" "$tmp_dir/package.deb"

          (
            cd "$tmp_dir"
            ar x package.deb
          )

          data_archive="$(find "$tmp_dir" -maxdepth 1 -type f -name 'data.tar*' | sort | tail -n 1)"

          if [ -z "$data_archive" ]; then
            echo "::error::Source .deb does not contain a data archive."
            exit 1
          fi

          tar -xf "$data_archive" -C "$tmp_root"

          if [ ! -d "$tmp_root/opt/minimax-agent" ]; then
            echo "::error::Source .deb does not contain /opt/minimax-agent."
            exit 1
          fi

          mkdir -p linux-build/opt
          cp -a "$tmp_root/opt/minimax-agent" linux-build/opt/

      - name: Check RPM build scripts syntax
        run: |
          set -euo pipefail
          bash -n build-rpm.sh
          bash -n tests/verify-rpm.sh

      - name: Build RPM package
        run: |
          set -euo pipefail
          bash ./build-rpm.sh

      - name: Verify RPM package
        run: |
          set -euo pipefail

          rpm_file="$(find output -maxdepth 1 -type f -name '*.rpm' | sort | tail -n 1)"

          if [ -z "$rpm_file" ]; then
            echo "::error::No .rpm package was created."
            exit 1
          fi

          bash tests/verify-rpm.sh "$rpm_file"

      - name: Upload RPM package artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: output/*.rpm
          if-no-files-found: error

  publish-release:
    name: Upload packages to GitHub release
    runs-on: ubuntu-latest
    needs:
      - build-deb
      - build-rpm

    # Required by softprops/action-gh-release to upload release assets.
    permissions:
      contents: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify release assets before upload
        run: |
          set -euo pipefail

          echo "Release assets prepared for upload:"
          ls -lh dist

          deb_file="$(find dist -maxdepth 1 -type f -name '*.deb' | sort | tail -n 1)"
          rpm_file="$(find dist -maxdepth 1 -type f -name '*.rpm' | sort | tail -n 1)"

          if [ -z "$deb_file" ]; then
            echo "::error::Missing Debian package artifact."
            exit 1
          fi

          if [ -z "$rpm_file" ]; then
            echo "::error::Missing RPM package artifact."
            exit 1
          fi

      - name: Upload packages to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          fail_on_unmatched_files: true
          files: |
            dist/*.deb
            dist/*.rpm
